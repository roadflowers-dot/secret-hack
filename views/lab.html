<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECRET//HACK — 실습실</title>
<link rel="stylesheet" href="/css/matrix.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo glow">SECRET//HACK</div>
    <div class="sp"></div>
    <a class="btn small" id="adminlink" href="/admin" hidden>ADMIN</a>
    <div class="who" id="who"></div>
    <button class="small" id="logout">logout</button>
  </header>

  <div style="max-width:1100px;margin:0 auto;padding:20px 16px">
    <section class="panel" id="home">
      <h1 class="glow">해킹 방어 훈련</h1>
      <div class="out" id="introterm" style="border-style:solid"></div>
      <p>공격이 <b>어떻게</b> 들어오는지 이해하고, <b>어떤 방어</b>가 그걸 막는지 직접 설정해 보는 시뮬레이션 훈련장입니다.
        모든 테스트는 브라우저 안의 가상 환경에서 실행되며 실제 시스템에는 아무 영향이 없습니다.</p>

      <div class="tabs levels" role="tablist" aria-label="난이도">
        <button role="tab" data-level="1" aria-selected="true"><span class="lv lv1">초급</span></button>
        <button role="tab" data-level="2" aria-selected="false"><span class="lv lv2">중급</span></button>
        <button role="tab" data-level="3" aria-selected="false"><span class="lv lv3">상급</span></button>
        <span style="flex:1"></span>
        <span class="muted" id="progress" style="align-self:center;font-size:13px"></span>
      </div>
      <p class="muted" id="leveldesc" style="font-size:13px"></p>
      <div class="grid" id="modlist"></div>
    </section>

    <section class="panel" id="module" hidden>
      <button class="small" id="back">← 목록</button>
      <div id="modhead" style="margin-top:12px"></div>
      <div id="modbody"></div>
    </section>

    <p class="amber" style="font-size:12px;margin-top:14px">허가받지 않은 시스템을 공격하는 것은 불법입니다 (정보통신망법 제48조 등). 접속 IP와 계정, 실습 완료 기록은 보안 로그에 남습니다.</p>
  </div>
</div>
<script src="/js/matrix.js"></script>
<script src="/js/lab.js"></script>
<script src="/js/levels/beginner.js"></script>
<script src="/js/levels/intermediate.js"></script>
<script src="/js/levels/advanced.js"></script>
<script src="/js/lab-start.js"></script>
</body>
</html>
