name: Deploy to Firebase

on:
  push:
    branches: [main, claude/kind-faraday-b4rm2s]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set (see README)"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting,firestore --project secret-hack-515013 --non-interactive
      - name: Remove key
        if: always()
        run: shred -u "$RUNNER_TEMP/sa.json" 2>/dev/null || true
